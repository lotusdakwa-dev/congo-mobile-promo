{% extends 'core/base.html' %}
{% block content %}
<div style="max-width: 400px; margin: 100px auto; text-align: center; background: var(--card-bg); padding: 40px; border-radius: 12px; border: 1px solid var(--border-color);">
    <h2 style="margin-bottom: 20px;">Accès Administrateur</h2>
    <p style="color: var(--text-muted);">Veuillez entrer le code PIN pour continuer</p>
    
    <form method="POST" style="margin-top: 20px;">
        {% csrf_token %}
        <input type="password" name="pin" maxlength="4" pattern="\d{4}" required 
               style="width: 100%; padding: 15px; font-size: 24px; text-align: center; border-radius: 8px; border: 1px solid var(--border-color); background: #0d1b2a; color: white;">
        <button type="submit" style="margin-top: 20px; width: 100%; padding: 15px; background: var(--accent); color: white; border: none; border-radius: 8px; font-weight: bold;">
            Entrer
        </button>
    </form>
    {% if messages %}
        <p style="color: #e63946; margin-top: 15px;">{{ messages }}</p>
    {% endif %}
</div>
{% endblock %}
