{% extends 'core/base.html' %}
{% load static %}
{% block content %}
<div class="section-container" style="max-width: 600px; margin: 40px auto; background: var(--card-bg); padding: 35px; border-radius: 12px; border: 1px solid var(--border-color);">
    <h2 style="font-size: 24px; color: var(--text-color); margin-top: 0; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px;">Finaliser votre commande</h2>

    <!-- Résumé de l'article -->
    <div style="background: rgba(15, 23, 42, 0.4); padding: 20px; border-radius: 8px; margin-bottom: 25px; border: 1px solid var(--border-color);">
        <h3 style="margin: 0 0 10px 0; font-size: 16px; color: var(--text-muted); text-transform: uppercase;">Résumé de l'article</h3>
        <p style="margin: 5px 0; font-size: 18px; font-weight: bold; color: var(--text-color);">Article : {{ product.name }}</p>
        <p style="margin: 5px 0; font-size: 14px; color: var(--text-muted);">Marque : {{ product.brand }}</p>
        <div style="margin-top: 15px; font-size: 22px; font-weight: bold; color: var(--accent);">
            Prix : ${{ product.price_usd }}
        </div>
    </div>

    <!-- Formulaire de commande -->
    <form method="POST" style="display: flex; flex-direction: column; gap: 20px;">
        {% csrf_token %}
        
        <div style="display: flex; flex-direction: column; gap: 8px;">
            <label style="font-size: 14px; font-weight: 500; color: var(--text-color);">Nom complet</label>
            <input type="text" name="full_name" placeholder="Ex: Jean Mukendi" required style="padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); background: #1e293b; color: var(--text-color); font-size: 14px;">
        </div>

        <div style="display: flex; flex-direction: column; gap: 8px;">
            <label style="font-size: 14px; font-weight: 500; color: var(--text-color);">Numéro de téléphone (WhatsApp)</label>
            <input type="text" name="phone_number" placeholder="Ex: +243 812345678" required style="padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); background: #1e293b; color: var(--text-color); font-size: 14px;">
        </div>

        <div style="display: flex; flex-direction: column; gap: 8px;">
            <label style="font-size: 14px; font-weight: 500; color: var(--text-color);">Commune à Kinshasa</label>
            <input type="text" name="commune" placeholder="Ex: Gombe, Lingwala, Limete..." required style="padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); background: #1e293b; color: var(--text-color); font-size: 14px;">
        </div>

        <div style="display: flex; flex-direction: column; gap: 8px;">
            <label style="font-size: 14px; font-weight: 500; color: var(--text-color);">Adresse de livraison précise</label>
            <textarea name="address_details" rows="3" placeholder="Avenue, numéro, repère..." required style="padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); background: #1e293b; color: var(--text-color); font-size: 14px; resize: vertical;"></textarea>
        </div>

        <button type="submit" class="btn-buy" style="background-color: var(--accent); color: white; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; text-align: center; margin-top: 10px;">
            Valider la commande
        </button>
    </form>
</div>
{% endblock %}
