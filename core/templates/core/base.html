{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Congo Mobile Promo</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #f59e0b;
            --border-color: #334155;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
        }
        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        .nav-links a {
            color: var(--text-color);
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            transition: color 0.2s;
        }
        .nav-links a:hover {
            color: var(--accent);
        }
    </style>
    <link rel="stylesheet" href="{% static 'core/css/style.css' %}">
</head>
<body>

    <header>
        <div style="font-size: 20px; font-weight: bold; color: var(--accent);">
            📱 Congo Mobile Promo
        </div>
        <div class="nav-links">
            <a href="{% url 'home' %}">Accueil</a>
            <a href="{% url 'product_list' %}">Boutique</a>
            <a href="{% url 'dashboard' %}">Tableau de Bord</a>
            <a href="{% url 'cart_detail' %}" style="display: flex; align-items: center; gap: 5px;">
                🛒 Panier 
                {% if request.session.cart %}
                    <span style="background: var(--accent); color: white; padding: 2px 6px; border-radius: 50%; font-size: 11px;">{{ request.session.cart|length }}</span>
                {% endif %}
            </a>
        </div>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
